# Checks Cargo.lock against the RustSec advisory database: on every change to the lock file and once a week
# (new advisories appear without any change here).
name: Audit

on:
  push:
    branches: [main]
    paths: [Cargo.lock]
  pull_request:
    paths: [Cargo.lock]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # Vulnerabilities always fail it; so do unsound and yanked crates. A crate being "unmaintained" is shown
      # but does not fail: the three that are (zbus_names, zvariant, zvariant_derive, reported 2026-10-16) come
      # in through the Linux screen-reader support (accesskit_unix) and are not ours to replace.
      - name: Audit
        run: cargo audit --deny unsound --deny yanked
