name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: "The font library (public OFL fonts, served from this site and never fetched from elsewhere at run time)"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Stitchwright/stitchfoundry-fonts
          path: stitchfoundry-fonts
          sparse-checkout: fonts
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
      - name: Install wasm-bindgen CLI matching Cargo.lock
        run: |
          version=$(awk '/^name = "wasm-bindgen"$/ {getline; gsub(/[^0-9.]/, "", $0); print; exit}' Cargo.lock)
          cargo install wasm-bindgen-cli --version "$version" --locked
      # The AI and account service the page may talk to is a repository variable (Settings > Variables >
      # LF_CLOUD_URL, an https address). Without it the page is built without the AI menu.
      - name: Build the browser version
        env:
          LF_CLOUD_URL: ${{ vars.LF_CLOUD_URL }}
        run: sh apps/laserfoundry-web/build.sh
      - name: Assemble site
        env:
          LF_CLOUD_URL: ${{ vars.LF_CLOUD_URL }}
        run: |
          mkdir site
          # the page's content security policy names the service's origin, or nothing
          origin=$(printf '%s' "$LF_CLOUD_URL" | sed -n 's|^\(https://[^/?# ]*\).*|\1|p')
          sed "s|__CLOUD_ORIGIN__|$origin|" apps/laserfoundry-web/index.html > site/index.html
          cp -r apps/laserfoundry-web/pkg site/pkg
          cargo run --locked -q -p xtask -- site-fonts stitchfoundry-fonts site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
