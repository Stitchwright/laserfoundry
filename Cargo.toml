[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
exclude = ["fuzz"]
default-members = ["crates/*", "apps/laserfoundry-cli", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/Stitchwright/laserfoundry"

[workspace.dependencies]
# internal
laserfoundry-geom = { path = "crates/geom" }
laserfoundry-i18n = { path = "crates/i18n" }
laserfoundry-fontlib = { path = "crates/fontlib" }
laserfoundry-ai = { path = "crates/ai" }
laserfoundry-doc = { path = "crates/doc" }
laserfoundry-toolpath = { path = "crates/toolpath" }
laserfoundry-text = { path = "crates/text" }
laserfoundry-nest = { path = "crates/nest" }
laserfoundry-icon = { path = "crates/icon" }
laserfoundry-pathops = { path = "crates/pathops" }
laserfoundry-gcode = { path = "crates/gcode" }
laserfoundry-svg = { path = "crates/svg" }
laserfoundry-dxf = { path = "crates/dxf" }
laserfoundry-format = { path = "crates/format" }
laserfoundry-device = { path = "crates/device" }
laserfoundry-engine = { path = "crates/engine" }
laserfoundry-mcp = { path = "crates/mcp" }
laserfoundry-fuzzkit = { path = "crates/fuzzkit" }
laserfoundry-ui-egui = { path = "crates/ui-egui" }

# foundation
kurbo = { version = "0.13", features = ["serde"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
skrifa = "0.48"
harfrust = "0.14"
unicode-bidi = "0.3"
web-time = "1"
log = "0.4"
proptest = "1"
usvg = "0.48"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
eframe = { version = "0.37", default-features = false }
egui = "0.36"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
# LaserFoundry never crashes: shipped code returns `Result`/`Option` instead of panicking (see
# AGENTS.md › Robustness). Tests may unwrap (clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
