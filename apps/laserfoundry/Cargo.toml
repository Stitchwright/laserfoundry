[package]
name = "laserfoundry"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "laserfoundry"

[lints]
workspace = true

[features]
default = ["serial"]
# Real serial ports (GRBL over USB). Disable for a simulator-only build.
serial = ["laserfoundry-device/serial"]

[dependencies]
laserfoundry-engine = { workspace = true }
laserfoundry-fontlib = { workspace = true }
laserfoundry-ai = { workspace = true }
ureq = "3"
laserfoundry-i18n = { workspace = true }
laserfoundry-ui-egui = { workspace = true }
laserfoundry-mcp = { workspace = true }
laserfoundry-device = { workspace = true }
eframe = { workspace = true, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
egui = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }
rfd = "0.17"
env_logger = "0.11"
